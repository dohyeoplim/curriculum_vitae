name: Build and Deploy CV

on:
  push:
    branches:
      - main
    paths:
      - "**/*.tex"
      - "index.html"
      - "CNAME"
      - ".github/workflows/build-cv.yml"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile with XeLaTeX
        run: latexmk -xelatex -interaction=nonstopmode -halt-on-error -jobname=Dohyeop_Lim cv.tex

      - name: Prepare site
        run: |
          mkdir -p _site
          cp Dohyeop_Lim.pdf index.html CNAME _site/
          touch _site/.nojekyll

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dohyeop_Lim
          path: Dohyeop_Lim.pdf

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  update-pdf:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: Dohyeop_Lim
          path: generated

      - name: Commit PDF back to repo
        run: |
          cp generated/Dohyeop_Lim.pdf Dohyeop_Lim.pdf
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f Dohyeop_Lim.pdf
          if git diff --staged --quiet; then
            echo "No changes to the PDF."
          else
            git commit -m "ci: rebuild pdf"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
